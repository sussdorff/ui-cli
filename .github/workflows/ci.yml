name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: latest
          python-version: "3.14"

      - name: Run unit tests
        run: uv run pytest tests/unit

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: latest
          python-version: "3.14"

      - name: Build distribution artifacts
        run: uv build

  toolchains:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check toolchain versions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .agents/standards/toolchains/scripts/check_toolchain_versions.py
